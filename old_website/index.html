<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NineDeploy — the self-hosted deployment platform with terminal-grade power. Zero-downtime deploys, managed databases, wildcard HTTPS, multi-server, MCP for AI agents."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NineDeploy" />
    <meta property="og:title" content="NineDeploy — ship like you mean it" />
    <meta
      property="og:description"
      content="Self-hosted PaaS: zero-downtime deploys, managed databases, wildcard HTTPS, multi-server agents — one SQLite file on your own server."
    />
    <meta name="twitter:card" content="summary" />
    <title>NineDeploy — ship like you mean it</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply stored theme before paint to avoid flash
      try {
        const t = localStorage.getItem("nd-site-theme");
        if (t === "light") document.documentElement.classList.remove("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
