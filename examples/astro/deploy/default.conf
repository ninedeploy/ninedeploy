# Served by nginxinc/nginx-unprivileged, which listens on 8080 and runs without root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Built pages are files or directories with an index.html; anything else is a 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # The health check the deployment waits for (.ninedeploy: run.healthcheck): a static file.
    location = /healthz {
        default_type application/json;
    }
}
