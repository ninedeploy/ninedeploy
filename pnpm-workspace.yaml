packages:
  - "apps/*"
  - "packages/*"
  - "website"

# Force js-yaml >= 4.3.2: pm2 pins the vulnerable 4.3.0 exactly. 4.3.1 fixed
# CVE-2026-59870 / GHSA-5p4m-2wfm-xmqj; 4.3.2 fixes the merge-key CPU
# exhaustion (r098) — reachable here, since user compose files and repo
# ninedeploy.yml manifests are parsed with it. Stays on the 4.x major.
overrides:
  js-yaml: "^4.3.2"
  # esbuild <=0.24.2 (GHSA-67mh-4wv8-2f99) arrives via the deprecated
  # @esbuild-kit toolchain under drizzle-kit (0.18.20). Pin the exact patched
  # version drizzle-kit already uses (0.25.12) — not a bare >= range, which
  # would let the deprecated toolchain ride a newer major than drizzle-kit's own.
  esbuild: "0.25.12"
  # The drizzle-kit patch removes @esbuild-kit/esm-loader from its manifest and
  # the archiver-utils patch moves glob to ^13 — but pnpm keeps resolving those
  # edges from the UNPATCHED manifests, so the lockfile (and the installed
  # store) kept carrying the deprecated packages the patches exist to remove.
  # Overrides cut the edges at resolution level: esm-loader is gone entirely
  # (the patched drizzle-kit never imports it) and every glob ^10 consumer
  # resolves into the maintained 13.x line already in the tree.
  "@esbuild-kit/esm-loader": "-"
  "glob@^10.0.0": "^13.0.6"
  # fast-uri <3.1.6 / <4.1.3 (2026 GHSA set: host confusion + SSRF via IDN /
  # IPv6 / percent-encoding normalization) arrives on BOTH majors via fastify:
  # ajv + ajv-formats declare ^3, @fastify/ajv-compiler and
  # fast-json-stringify declare ^4. Pin each major to its first patched
  # release — a blanket bump to 4.x would yank ajv's edge across a major.
  "fast-uri@^3.0.0": "3.1.6"
  "fast-uri@^4.0.0": "4.1.3"
  # qs <6.16.0 (GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g — DoS via bracket-key
  # comma parsing / attacker-controlled isBuffer) arrives solely through the
  # MCP SDK's express → body-parser edge, all on the 6.x line. Single pin is
  # safe: only one qs instance exists in the tree.
  qs: "6.16.0"
  # hono <4.13.5 (GHSA-gqvv-2mrq-wpjv, GHSA-g6gw-c38x-mqfc, GHSA-crvj-82cr-hjcx)
  # arrives via the MCP SDK's @hono/node-server. Not reachable today — the MCP
  # server is stdio-only — so this is defence in depth (r098).
  hono: "^4.13.5"

# Dependencies allowed to run install scripts (pnpm 11 blocks these by default).
# esbuild ships its native binary via postinstall; Vite/tsx need it.
allowBuilds:
  cpu-features: true
  esbuild: true
  node-pty: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@node-rs/argon2-android-arm-eabi@2.1.0'
  - '@node-rs/argon2-android-arm64@2.1.0'
  - '@node-rs/argon2-darwin-arm64@2.1.0'
  - '@node-rs/argon2-darwin-x64@2.1.0'
  - '@node-rs/argon2-freebsd-x64@2.1.0'
  - '@node-rs/argon2-linux-arm-gnueabihf@2.1.0'
  - '@node-rs/argon2-linux-arm64-gnu@2.1.0'
  - '@node-rs/argon2-linux-arm64-musl@2.1.0'
  - '@node-rs/argon2-linux-x64-gnu@2.1.0'
  - '@node-rs/argon2-linux-x64-musl@2.1.0'
  - '@node-rs/argon2-win32-arm64-msvc@2.1.0'
  - '@node-rs/argon2-win32-ia32-msvc@2.1.0'
  - '@node-rs/argon2-win32-x64-msvc@2.1.0'
  - '@node-rs/argon2@2.1.0'
  - '@tanstack/query-core@5.102.2'
  - '@tanstack/react-query@5.102.2'
  - '@types/react-dom@19.2.5'

patchedDependencies:
  # glob@10.5.0 is deprecated (isaacs: "contain widely publicized security
  # vulnerabilities, fixed in the current version") and arrives via
  # testcontainers → archiver@7.0.1 → archiver-utils@5.0.2, which pins glob ^10.
  # archiver@8.0.0 would drop the chain but is ESM-only while testcontainers is
  # CJS (ERR_REQUIRE_ESM). Patch archiver-utils' range to ^13.0.6 instead: glob
  # 13 is already in the tree (fastify) and its sync API is a drop-in.
  archiver-utils@5.0.2: patches/archiver-utils@5.0.2.patch
  drizzle-kit@0.31.10: patches/drizzle-kit@0.31.10.patch
