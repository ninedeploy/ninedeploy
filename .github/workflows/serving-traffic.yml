name: Serving traffic

on:
  pull_request:
    paths:
      - 'apps/server/src/lib/node*Traffic*.ts'
      - 'apps/server/src/lib/proxyTrafficCounter.ts'
      - 'apps/server/src/lib/servingTrafficRouting.ts'
      - 'apps/server/src/lib/agentClient.ts'
      - 'apps/server/src/lib/agentCapabilities.ts'
      - 'apps/server/src/agentOps/servingTraffic.ts'
      - 'apps/server/src/agentOps/index.ts'
      - 'apps/server/test/nodeFeatureRefusals.test.ts'
      - 'packages/schemas/src/proxyTraffic.ts'
      - 'packages/schemas/src/multiNode.ts'
      - 'scripts/smoke-serving-traffic.mjs'
      - 'scripts/fixtures/serving-traffic-agent.mjs'
      - 'scripts/lib/serving-traffic-routing.mjs'
      - 'scripts/smoke-wake-recovery.mjs'
      - 'scripts/fixtures/wake-recovery.mjs'
      - 'scripts/fixtures/wake-recovery-sampler.mjs'
      - 'scripts/smoke-node-sleep-wake.mjs'
      - 'scripts/fixtures/node-sleep-wake.mjs'
      - 'scripts/fixtures/node-sleep-wake-sampler.mjs'
      - 'scripts/smoke-node-canary.mjs'
      - 'scripts/lib/smoke-node-manual-wake.mjs'
      - 'scripts/fixtures/node-manual-wake-idle.mjs'
      - 'scripts/fixtures/node-sleep-restoration.mjs'
      - 'scripts/lib/smoke-node-sleep-restoration.mjs'
      - 'scripts/lib/smoke-sealed-routing-fault.mjs'
      - 'scripts/lib/smoke-node-automatic-sleep.mjs'
      - 'scripts/lib/smoke-git-repository.mjs'
      - 'scripts/lib/smoke-swarm-runtime.mjs'
      - '.github/workflows/serving-traffic.yml'
  workflow_dispatch:
    inputs:
      wake_recovery:
        description: Run the real Traefik catcher replacement acceptance instead of serving windows
        type: boolean
        default: false
      node_sleep_wake:
        description: Run real five-minute idle, application Stop and readiness-held wake acceptance
        type: boolean
        default: false
      swarm_runtime:
        description: Verify real Swarm artifacts, pinned promotion/rollback and panel restart recovery
        type: boolean
        default: false
      automatic_node_sleep:
        description: Verify public automatic idle Stop, demand wake and panel restart through production timers
        type: boolean
        default: false
      sleep_restoration:
        description: Verify lost pre-Stop routing acknowledgement restores the running application
        type: boolean
        default: false
      manual_node_wake:
        description: Verify public manual wake and real worker without touching a same-name panel container
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: serving-traffic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serving-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
      - name: Build candidate
        run: docker build -t ninedeploy:serving .
      - name: Observe ordinary serving generations through sealed HTTP and real Traefik
        if: github.event.inputs.wake_recovery != 'true' && github.event.inputs.node_sleep_wake != 'true' && github.event.inputs.manual_node_wake != 'true' && github.event.inputs.sleep_restoration != 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        run: node scripts/smoke-serving-traffic.mjs --image=ninedeploy:serving --proof=.temp_files/serving-traffic
      - name: Verify catcher replacement through real sealed HTTP and sampled Traefik traffic
        if: github.event.inputs.wake_recovery == 'true' && github.event.inputs.node_sleep_wake != 'true' && github.event.inputs.manual_node_wake != 'true' && github.event.inputs.sleep_restoration != 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        run: node scripts/smoke-wake-recovery.mjs --image=ninedeploy:serving --proof=.temp_files/serving-traffic/wake-recovery
      - name: Verify real idle, immutable application Stop and readiness-held wake
        if: github.event.inputs.node_sleep_wake == 'true' && github.event.inputs.manual_node_wake != 'true' && github.event.inputs.sleep_restoration != 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        run: node scripts/smoke-node-sleep-wake.mjs --image=ninedeploy:serving --proof=.temp_files/serving-traffic/node-sleep-wake
      - name: Verify public manual node wake through isolated panel and node daemons
        if: github.event.inputs.manual_node_wake == 'true' && github.event.inputs.sleep_restoration != 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        run: node scripts/smoke-node-canary.mjs --manual-wake-only --image=ninedeploy:serving --proof=.temp_files/serving-traffic/manual-node-wake
      - name: Preserve observations and owned cleanup receipts
        if: always() && github.event.inputs.wake_recovery != 'true' && github.event.inputs.node_sleep_wake != 'true' && github.event.inputs.manual_node_wake != 'true' && github.event.inputs.sleep_restoration != 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serving-traffic-${{ github.run_id }}
          path: .temp_files/serving-traffic/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve public wake replacement evidence only
        if: always() && github.event.inputs.wake_recovery == 'true' && github.event.inputs.node_sleep_wake != 'true' && github.event.inputs.manual_node_wake != 'true' && github.event.inputs.sleep_restoration != 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wake-recovery-${{ github.run_id }}
          path: .temp_files/serving-traffic/wake-recovery/public/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve public real sleep and wake evidence only
        if: always() && github.event.inputs.node_sleep_wake == 'true' && github.event.inputs.manual_node_wake != 'true' && github.event.inputs.sleep_restoration != 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-sleep-wake-${{ github.run_id }}
          path: .temp_files/serving-traffic/node-sleep-wake/public/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve public manual wake receipts only
        if: always() && github.event.inputs.manual_node_wake == 'true' && github.event.inputs.sleep_restoration != 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual-node-wake-${{ github.run_id }}
          path: |
            .temp_files/serving-traffic/manual-node-wake/runtime-result.json
            .temp_files/serving-traffic/manual-node-wake/runtime-cleanup.json
            .temp_files/serving-traffic/manual-node-wake/manual-wake-idle.json
            .temp_files/serving-traffic/manual-node-wake/manual-wake-traffic.json
            .temp_files/serving-traffic/manual-node-wake/manual-wake-outcome.json
            .temp_files/serving-traffic/manual-node-wake/cases.json
            .temp_files/serving-traffic/manual-node-wake/failure-state.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Verify lost pre-Stop routing acknowledgement through the real sealed agent
        if: github.event.inputs.sleep_restoration == 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        run: node scripts/smoke-node-canary.mjs --sleep-restoration-only --image=ninedeploy:serving --proof=.temp_files/serving-traffic/sleep-restoration
      - name: Preserve public restoration receipts only
        if: always() && github.event.inputs.sleep_restoration == 'true' && github.event.inputs.automatic_node_sleep != 'true' && github.event.inputs.swarm_runtime != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sleep-restoration-${{ github.run_id }}
          path: |
            .temp_files/serving-traffic/sleep-restoration/runtime-result.json
            .temp_files/serving-traffic/sleep-restoration/runtime-cleanup.json
            .temp_files/serving-traffic/sleep-restoration/sleep-restoration-receipt.json
            .temp_files/serving-traffic/sleep-restoration/sleep-restoration-traffic.json
            .temp_files/serving-traffic/sleep-restoration/cases.json
            .temp_files/serving-traffic/sleep-restoration/failure-state.json
          if-no-files-found: warn
      - name: Verify public automatic node sleep and wake recovery
        if: github.event.inputs.automatic_node_sleep == 'true' && github.event.inputs.swarm_runtime != 'true'
        run: node scripts/smoke-node-canary.mjs --automatic-sleep-only --image=ninedeploy:serving --proof=.temp_files/serving-traffic/automatic-node-sleep
      - name: Preserve public automatic sleep receipts only
        if: always() && github.event.inputs.automatic_node_sleep == 'true' && github.event.inputs.swarm_runtime != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: automatic-node-sleep-${{ github.run_id }}
          path: |
            .temp_files/serving-traffic/automatic-node-sleep/runtime-result.json
            .temp_files/serving-traffic/automatic-node-sleep/runtime-cleanup.json
            .temp_files/serving-traffic/automatic-node-sleep/automatic-sleep-idle.json
            .temp_files/serving-traffic/automatic-node-sleep/automatic-sleep-control.json
            .temp_files/serving-traffic/automatic-node-sleep/automatic-sleep-audit.json
            .temp_files/serving-traffic/automatic-node-sleep/automatic-sleep-traffic.json
            .temp_files/serving-traffic/automatic-node-sleep/cases.json
            .temp_files/serving-traffic/automatic-node-sleep/failure-state.json
          if-no-files-found: warn
      - name: Verify real Swarm pinned artifacts and restart recovery
        if: github.event.inputs.swarm_runtime == 'true'
        run: node scripts/smoke-node-canary.mjs --swarm-runtime-only --image=ninedeploy:serving --proof=.temp_files/serving-traffic/swarm-runtime
      - name: Preserve public Swarm receipts only
        if: always() && github.event.inputs.swarm_runtime == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swarm-runtime-${{ github.run_id }}
          path: |
            .temp_files/serving-traffic/swarm-runtime/runtime-result.json
            .temp_files/serving-traffic/swarm-runtime/runtime-cleanup.json
            .temp_files/serving-traffic/swarm-runtime/swarm-source-traffic.json
            .temp_files/serving-traffic/swarm-runtime/swarm-target-traffic.json
            .temp_files/serving-traffic/swarm-runtime/swarm-failure-traffic.json
            .temp_files/serving-traffic/swarm-runtime/swarm-failure-state.json
            .temp_files/serving-traffic/swarm-runtime/cases.json
            .temp_files/serving-traffic/swarm-runtime/failure-state.json
          if-no-files-found: warn
