name: Framework starters

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: NineDeploy candidate image, preferably by digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Source upload and proxy smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.repository == 'ninedeploy/ninedeploy' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
      - name: Build and route all three starters
        env:
          IMAGE: ${{ inputs.image || format('ghcr.io/ninedeploy/ninedeploy:main-{0}', github.event.workflow_run.head_sha) }}
        run: node scripts/smoke-framework-starters.mjs --image="$IMAGE" --proof=framework-starter-receipts
      - name: Upload deployment receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framework-starters-${{ github.run_id }}
          path: |
            framework-starter-receipts/run-*/result.json
            framework-starter-receipts/run-*/*.log
          retention-days: 14
          if-no-files-found: warn
