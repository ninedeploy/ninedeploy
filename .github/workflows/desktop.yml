name: Desktop

# R6: the desktop client lives in desktop/ with its own lockfile, outside the
# panel's pnpm workspace, so the main CI never installs Electron. This
# workflow tests it, builds the installers on each platform, launches the
# packaged app and keeps a sign-in across a restart through the OS credential
# store. Installers are build artifacts, not releases; they are signed only
# when the signing secrets below are set.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'apps/web/src/lib/desktop.ts'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'apps/web/src/lib/desktop.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test · package · launch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Signing is opt-in through repository secrets, and never on a pull
      # request (its code would run with the certificates). Without them the
      # installers are built unsigned, as before. electron-builder takes an
      # empty CSC_LINK as set, so a variable is exported only when its secret is.
      #   Windows: WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD.
      #   macOS:   MAC_CSC_LINK (base64 .p12, Developer ID Application) and
      #            MAC_CSC_KEY_PASSWORD; notarization with APPLE_API_KEY_P8
      #            (the .p8 key's text), APPLE_API_KEY_ID and APPLE_API_ISSUER.
      - name: Signing credentials
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          WIN_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_PASS: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$RUNNER_OS" = Windows ] && [ -n "$WIN_LINK" ]; then
            { echo "WIN_CSC_LINK=$WIN_LINK"; echo "WIN_CSC_KEY_PASSWORD=$WIN_PASS"; echo "ND_SIGNED=1"; } >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_LINK" ]; then
            { echo "CSC_LINK=$MAC_LINK"; echo "CSC_KEY_PASSWORD=$MAC_PASS"; echo "ND_SIGNED=1"; } >> "$GITHUB_ENV"
            if [ -n "$APPLE_P8" ]; then
              printf '%s\n' "$APPLE_P8" > "$RUNNER_TEMP/apple-api-key.p8"
              { echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8"; echo "APPLE_API_KEY_ID=$APPLE_KEY_ID"; echo "APPLE_API_ISSUER=$APPLE_ISSUER"; echo "ND_NOTARIZED=1"; } >> "$GITHUB_ENV"
            fi
          fi

      - name: Build installers
        run: pnpm dist
        env:
          # Never search the runner's keychain: sign only with the certificate above, if any.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the signature (Windows)
        if: runner.os == 'Windows' && env.ND_SIGNED == '1'
        shell: pwsh
        run: |
          foreach ($file in @('release/win-unpacked/NineDeploy.exe') + (Get-ChildItem release/*.exe).FullName) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') { throw "$file is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
            Write-Output "$file signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Check the signature (macOS)
        if: runner.os == 'macOS' && env.ND_SIGNED == '1'
        run: |
          for app in release/mac*/NineDeploy.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "$ND_NOTARIZED" = 1 ]; then
              spctl --assess --type execute --verbose=4 "$app"
              xcrun stapler validate "$app"
            fi
          done

      - name: Signing state
        shell: bash
        run: echo "installers ${ND_SIGNED:+signed}${ND_SIGNED:-unsigned}${ND_NOTARIZED:+ and notarized} on $RUNNER_OS"

      - name: Allow the Chromium sandbox (Ubuntu 24.04 restricts user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Launch the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm smoke

      - name: Launch the packaged app
        if: runner.os != 'Linux'
        run: pnpm smoke
        env:
          # On the macOS runner the unsigned app's Keychain lookup fails
          # (errSecAuthFailed), also with an unlocked keychain of its own as the
          # only one searched (runs 41240070336, 41243481908, 41246805474).
          # Chromium then seals with a key it never stores. The smoke checks
          # that fallback instead: sealed, never plain text, gone after a restart.
          ND_SMOKE_KEYCHAIN_UNREACHABLE: ${{ runner.os == 'macOS' && '1' || '' }}

      # The same check against what a user actually installs: the app as the
      # installer lays it down, not the unpacked build directory.
      - name: Install and launch the installers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends ./release/ninedeploy-desktop_*_amd64.deb
          xvfb-run -a pnpm smoke /opt/NineDeploy/ninedeploy-desktop
          sudo apt-get remove -y ninedeploy-desktop
          test ! -e /opt/NineDeploy/ninedeploy-desktop
          # The runner has no FUSE for mounting the AppImage; its runtime then
          # extracts itself and runs from there.
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a pnpm smoke "$(ls release/NineDeploy-*.AppImage)"

      - name: Install and launch the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem 'release/NineDeploy Setup *.exe').FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          # A per-user install: under %LOCALAPPDATA%\Programs, no admin rights.
          $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter NineDeploy.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'the installer laid down no NineDeploy.exe under LOCALAPPDATA\Programs' }
          Write-Output "installed at $exe"
          pnpm smoke $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process -FilePath (Join-Path (Split-Path $exe) 'Uninstall NineDeploy.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'the uninstaller left the app behind' }

      - name: Install and launch the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" = arm64 ]; then dmg=$(ls release/NineDeploy-*-arm64.dmg); else dmg=$(ls release/NineDeploy-*.dmg | grep -v -- -arm64.dmg); fi
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/nd-dmg" "$dmg"
          ditto "$RUNNER_TEMP/nd-dmg/NineDeploy.app" "$RUNNER_TEMP/Applications/NineDeploy.app"
          hdiutil detach "$RUNNER_TEMP/nd-dmg"
          pnpm smoke "$RUNNER_TEMP/Applications/NineDeploy.app/Contents/MacOS/NineDeploy"
        env:
          ND_SMOKE_KEYCHAIN_UNREACHABLE: '1'

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ninedeploy-desktop-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
