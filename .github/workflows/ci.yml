name: CI

on:
  push:
    branches: [main]
  pull_request:

# L-14: CI only ever reads the repository. Stating it explicitly means the
# workflow does not inherit whatever the repository default happens to be.
permissions:
  contents: read

# Cancel in-progress runs for the same ref when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # No `version:` input on purpose: action-setup derives the pnpm version
        # from "packageManager" in package.json. Pinning a second version here
        # makes every job fail with ERR_PNPM_BAD_PM_VERSION once they disagree.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26 # latest GA; pnpm 11 requires Node >= 22.13 (node:sqlite)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Note: no separate migration step — the server self-migrates at startup
      # and the db package tests apply the real migrations to a fresh SQLite
      # file (see packages/db/test/migrate.test.ts).
      - name: Test
        run: pnpm test

      # Schema↔snapshot drift guard: 'drizzle-kit generate' must be a no-op.
      # Any change (edited snapshot, new migration) means schema.ts and the
      # migrations meta snapshots disagree — fail instead of letting a spurious
      # migration surface later. `git status --porcelain` (not `git diff
      # --exit-code`) is used so brand-new untracked migration files are caught
      # too. When drift involves a column conflict drizzle-kit aborts on the
      # missing TTY, so the step also fails fast rather than hanging.
      #
      # drizzle-kit 0.31 wraps several internal failure paths in a try/catch
      # that only console.errors and exits 0 — the exit code alone proves
      # nothing. The ONLY acceptable outcome is the explicit no-diff line;
      # an error trace, a generated migration, or silence all fail.
      - name: Check for schema drift
        run: |
          out="$(pnpm --filter @ninedeploy/db exec drizzle-kit generate 2>&1)"
          echo "$out"
          echo "$out" | grep -q "No schema changes, nothing to migrate" || {
            echo "::error::Schema tooling failed or reported drift (output above)"
            exit 1
          }
          if [ -n "$(git status --porcelain -- packages/db/src/migrations)" ]; then
            echo "::error::Schema drift detected: drizzle-kit generate changed files under packages/db/src/migrations"
            git status --porcelain -- packages/db/src/migrations
            exit 1
          fi

      # Deprecated-dependency guard: a NON-frozen `pnpm install` re-derives the
      # ORIGINAL dependency edges into the lockfile, silently re-adding
      # @esbuild-kit/* and glob@10.5.0 even though patchedDependencies removes
      # them (pnpm keeps the pre-patch edges when re-resolving). pnpm audit does
      # NOT flag deprecated packages, so a re-derived lockfile would pass CI
      # unnoticed. The lockfile is the source of truth for `--frozen-lockfile`
      # installs, so grep it directly — but strip the overrides: metadata block
      # first, which legitimately NAMES the packages the overrides remove.
      - name: Check for deprecated dependencies
        run: |
          strip_overrides() { sed '/^overrides:/,/^patchedDependencies:/d' pnpm-lock.yaml; }
          if strip_overrides | grep -qE 'esbuild-kit|glob@10\.5\.0'; then
            echo "::error::Deprecated packages re-derived into pnpm-lock.yaml (non-frozen install re-added patched-away edges)"
            strip_overrides | grep -nE 'esbuild-kit|glob@10\.5\.0'
            exit 1
          fi

      # Installer sanity gate: install.sh runs as ROOT on operator machines
      # with `set -euo pipefail` — a syntax error or an unbound variable
      # (r087: "$DATA_DIR: unbound variable") aborts the upgrade AFTER the
      # panel is stopped, leaving production down. bash -n catches syntax,
      # shellcheck -S error catches the static subset of unset/typo'd
      # variables. The runtime set -u behaviour is additionally covered by
      # the installer's own smoke path below.
      - name: Installer sanity (bash -n + shellcheck)
        run: |
          bash -n install.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error install.sh
          else
            echo "shellcheck not present on runner — syntax check only"
          fi

      # Installer set -u smoke test: exercise the DATA_DIR resolution + the
      # writable-homes mkdir EXACTLY as the script runs (set -euo pipefail,
      # no inherited DATA_DIR) so a "used before defined" regression fails
      # here instead of on an operator's upgrade at the systemd step.
      - name: Installer set -u smoke test
        run: |
          set -euo pipefail
          INSTALL_DIR="$PWD"
          DATA_DIR_SETTING="${NINEDEPLOY_DATA_DIR:-$INSTALL_DIR/.data}"
          mkdir -p "$DATA_DIR_SETTING"
          DATA_DIR=$(cd "$DATA_DIR_SETTING" && pwd -P)
          mkdir -p "$DATA_DIR/docker-config" "$DATA_DIR/pm2"
          test -d "$DATA_DIR/docker-config" && test -d "$DATA_DIR/pm2"
          echo "set -u smoke test passed: DATA_DIR=$DATA_DIR"

  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Verifies the release workflow's Dockerfile compiles; no push happens here.
      - name: Build the image
        run: docker build -t ninedeploy:ci .

  # Publishes the panel image to GHCR on every push to main so an
  # `install.sh --docker` from the main channel never lands on a stale
  # `:latest`. The release workflow (release.yml) does the same on tag
  # push and re-tags `:latest`, so :latest on GHCR always points to the
  # most recent published image regardless of channel.
  #
  # One-time setup: the GHCR package must be set to "Public" visibility
  # at https://github.com/orgs/NineDeploy/packages/container/ninedeploy/settings
  # so an unauthenticated `docker pull` works for fresh installs. This
  # is a GitHub Packages UI setting; there is no API call that can do
  # it from CI.
  publish-image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only build + push from main. PRs run the build-only job above
    # to keep the workflow cheap and to avoid forking a public image
    # for every fork PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The image must never reach `:edge` (what --channel=main installs
    # pull) before the full suite and the integration tests are green —
    # an independent job would happily publish a broken commit.
    needs: [verify, integration]
    # L-14: least privilege. `packages: write` is the only permission
    # this job needs; everything else stays at the workflow default
    # of `contents: read`.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the multi-arch image (amd64 + arm64) and push only on main.
      # The cache-from layer accelerates the next push and keeps the
      # build under the 20-minute job timeout even on a clean runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v6.7.0

      - name: Build and push (edge + main-<sha>)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # `:edge` is what `install.sh --channel=main` pulls; the
          # sha-pinned tag is the immutable artifact a release manager
          # can re-tag to `:latest` (or roll back to) without rebuilding.
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:main-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:edge
          cache-to: type=inline

  integration:
    name: Integration tests (real Docker + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # No `version:` input on purpose: action-setup derives the pnpm version
        # from "packageManager" in package.json. Pinning a second version here
        # makes every job fail with ERR_PNPM_BAD_PM_VERSION once they disagree.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26 # latest GA; pnpm 11 requires Node >= 22.13 (node:sqlite)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Runs the testcontainers suite (real PostgreSQL container): exercises
      # the REAL backup/restore path end-to-end — arg-array docker exec,
      # docker cp, and the at-rest backup encryption round-trip.
      - name: Run integration tests
        run: pnpm --filter @ninedeploy/server exec vitest run --config vitest.integration.config.ts
        env:
          RUN_INTEGRATION: '1'
