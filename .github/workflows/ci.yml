name: CI

on:
  push:
    branches: [main]
  pull_request:

# L-14: CI only ever reads the repository. Stating it explicitly means the
# workflow does not inherit whatever the repository default happens to be.
permissions:
  contents: read

# Cancel in-progress runs for the same ref when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build · Test
    runs-on: ubuntu-latest
    # The serialized coverage suites take about 35 minutes on a 2-core runner,
    # and a slow runner needs more: on 2026-10-29 server and web finished just
    # as the 30-minute job was canceled, and on 2026-11-24 a runner about 1.45
    # times slower, by every package's own timing, was cut 41 minutes into the
    # test step. Leave time for the post-test checks instead of discarding a
    # completed run.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The registry drift guard diffs templates against the previous
          # release tag — a shallow checkout has no tags and the test would
          # silently skip. Full history costs seconds here.
          fetch-depth: 0

      - name: Setup pnpm
        # No `version:` input on purpose: action-setup derives the pnpm version
        # from "packageManager" in package.json. Pinning a second version here
        # makes every job fail with ERR_PNPM_BAD_PM_VERSION once they disagree.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Verify Node security baseline
        run: node -e "if (process.versions.node !== '26.12.1') throw new Error('Unexpected Node runtime')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # r712: the repository stores LF. A Windows commit with autocrlf off once
      # re-staged 1206 files with CRLF; fail the push that does it, not the tag.
      - name: Line endings (no CRLF stored)
        run: |
          bad="$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed"' | cut -f2-)"
          if [ -n "$bad" ]; then
            echo "::error::$(printf '%s\n' "$bad" | wc -l) tracked file(s) stored with CRLF:"
            printf '%s\n' "$bad" | head -20
            exit 1
          fi

      # r576: advisory only (continue-on-error) — a fresh upstream advisory
      # must not block every unrelated commit, but it should be visible on the
      # run that first sees it. Overrides in pnpm-workspace.yaml are the fix.
      - name: Dependency audit (production, high+; non-blocking)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Note: no separate migration step — the server self-migrates at startup
      # and the db package tests apply the real migrations to a fresh SQLite
      # file (see packages/db/test/migrate.test.ts).
      - name: Contract preflight (including Swarm runtime reader coverage)
        env:
          DOCKER_HOST: tcp://127.0.0.1:9
        run: pnpm check:contracts

      - name: Test
        # The server suite. It runs in several processes at once, each with its
        # files one after another, and its coverage floors are checked once, on
        # the merged report (scripts/test-server-sharded.mjs): in one process its
        # 888 files took 39 minutes of a runner on November 25, 2026. The other
        # packages' suites run in package-tests, on a runner of their own.
        run: pnpm test:server

      # Schema↔snapshot drift guard: 'drizzle-kit generate' must be a no-op.
      # Any change (edited snapshot, new migration) means schema.ts and the
      # migrations meta snapshots disagree — fail instead of letting a spurious
      # migration surface later. `git status --porcelain` (not `git diff
      # --exit-code`) is used so brand-new untracked migration files are caught
      # too. When drift involves a column conflict drizzle-kit aborts on the
      # missing TTY, so the step also fails fast rather than hanging.
      #
      # drizzle-kit 0.31 wraps several internal failure paths in a try/catch
      # that only console.errors and exits 0 — the exit code alone proves
      # nothing. The ONLY acceptable outcome is the explicit no-diff line;
      # an error trace, a generated migration, or silence all fail.
      - name: Check for schema drift
        run: |
          out="$(pnpm --filter @ninedeploy/db exec drizzle-kit generate 2>&1)"
          echo "$out"
          echo "$out" | grep -q "No schema changes, nothing to migrate" || {
            echo "::error::Schema tooling failed or reported drift (output above)"
            exit 1
          }
          if [ -n "$(git status --porcelain -- packages/db/src/migrations)" ]; then
            echo "::error::Schema drift detected: drizzle-kit generate changed files under packages/db/src/migrations"
            git status --porcelain -- packages/db/src/migrations
            exit 1
          fi

      # Deprecated-dependency guard: a NON-frozen `pnpm install` re-derives the
      # ORIGINAL dependency edges into the lockfile, silently re-adding
      # @esbuild-kit/* and glob@10.5.0 even though patchedDependencies removes
      # them (pnpm keeps the pre-patch edges when re-resolving). pnpm audit does
      # NOT flag deprecated packages, so a re-derived lockfile would pass CI
      # unnoticed. The lockfile is the source of truth for `--frozen-lockfile`
      # installs, so grep it directly — but strip the overrides: metadata block
      # first, which legitimately NAMES the packages the overrides remove.
      - name: Check for deprecated dependencies
        run: |
          strip_overrides() { sed '/^overrides:/,/^patchedDependencies:/d' pnpm-lock.yaml; }
          if strip_overrides | grep -qE 'esbuild-kit|glob@10\.5\.0'; then
            echo "::error::Deprecated packages re-derived into pnpm-lock.yaml (non-frozen install re-added patched-away edges)"
            strip_overrides | grep -nE 'esbuild-kit|glob@10\.5\.0'
            exit 1
          fi

      # Installer sanity gate: install.sh runs as ROOT on operator machines
      # with `set -euo pipefail` — a syntax error or an unbound variable
      # (r087: "$DATA_DIR: unbound variable") aborts the upgrade AFTER the
      # panel is stopped, leaving production down. bash -n catches syntax,
      # shellcheck -S error catches the static subset of unset/typo'd
      # variables. The runtime set -u behaviour is additionally covered by
      # the installer's own smoke path below.
      - name: Installer sanity (bash -n + shellcheck)
        run: |
          bash -n install.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error install.sh
          else
            echo "shellcheck not present on runner — syntax check only"
          fi

      # r576: the installer smoke test SOURCES the real install.sh (its
      # NINEDEPLOY_INSTALL_SOURCE_ONLY mode returns right after the pure
      # helpers, before anything touches the host) and runs those helpers
      # under the script's own `set -euo pipefail` against fixtures. It used
      # to re-type a few of the script's lines, which proved nothing about
      # install.sh itself.
      - name: Installer smoke test (real install.sh helpers)
        run: |
          set -euo pipefail
          NINEDEPLOY_INSTALL_SOURCE_ONLY=1 . ./install.sh
          # set -u: r087 was an unbound DATA_DIR at the systemd step.
          scratch="$(mktemp -d)"
          data_dir="$(NINEDEPLOY_DATA_DIR= resolve_data_dir "$scratch")"
          test "$data_dir" = "$(cd "$scratch/.data" && pwd -P)"
          # Release resolution: semver (not lexical) order, junk ignored.
          test "$(printf 'v0.2.9\nv0.2.36\nv0.10.0\nv0.9.99\nv1.0.0-rc1\nnot-a-tag\n' | highest_semver_tag)" = "v0.10.0"
          test "$(printf '{"url":"x","tag_name": "v0.10.35","name":"v0.10.35"}' | release_tag_from_json)" = "v0.10.35"
          test -z "$(printf '{"message":"Not Found"}' | release_tag_from_json)"
          test "$(printf '[{"name":"v0.9.99"},{"name":"v0.10.36"},{"name":"latest"}]' | highest_tag_from_tags_json)" = "v0.10.36"
          # A6: the stable channel — the highest release on the stable tag's commit, annotated tags peeled; none without a stable tag.
          test "$(printf 'aaa\trefs/tags/v0.18.24\nccc\trefs/tags/stable\nccc\trefs/tags/v0.18.3\neee\trefs/tags/v0.18.21\nccc\trefs/tags/v0.18.21^{}\n' | stable_tag_from_ls_remote)" = "v0.18.21"
          test -z "$(printf 'aaa\trefs/tags/v0.18.24\n' | stable_tag_from_ls_remote)"
          # Docker image tag: pinned > edge (main) > resolved release > latest.
          test "$(docker_image_tag v0.10.1 release v0.10.36)" = "v0.10.1"
          test "$(docker_image_tag '' main main)" = "edge"
          test "$(docker_image_tag '' release v0.10.36)" = "v0.10.36"
          test "$(docker_image_tag '' release main)" = "latest"
          # Nixpacks checksums are keyed by version: unknown versions get none.
          test -n "$(nixpacks_sha256 1.41.0 x86_64)"
          test -z "$(nixpacks_sha256 9.9.9 x86_64)"
          # r702: release integrity — SHA256SUMS parsing (text and binary
          # mode, exact names only, ambiguity refused), the checksum era, and
          # the asset names release-publish.yml attaches.
          # (`! cmd` never trips set -e, so refusals are asserted with `if`.)
          da="$(printf '%064d' 0 | tr 0 a)"; db="$(printf '%064d' 0 | tr 0 b)"
          sums="$(printf '%s  ninedeploy-v0.10.43.tar.gz\n%s *install.sh\n' "$da" "$db")"
          test "$(printf '%s\n' "$sums" | sha256sums_lookup ninedeploy-v0.10.43.tar.gz)" = "$da"
          test "$(printf '%s\n' "$sums" | sha256sums_lookup install.sh)" = "$db"
          if printf '%s\n' "$sums" | sha256sums_lookup ninedeploy-v0.10.4 >/dev/null; then exit 1; fi
          if printf '%s  x\n%s  x\n' "$da" "$db" | sha256sums_lookup x >/dev/null; then exit 1; fi
          if printf 'zz%s  x\n' "$da" | sha256sums_lookup x >/dev/null; then exit 1; fi
          printf 'release' > "$scratch/a.tar.gz"
          (cd "$scratch" && sha256sum a.tar.gz > SHA256SUMS)
          test "$(sha256sums_lookup a.tar.gz < "$scratch/SHA256SUMS")" = "$(sha256sum < "$scratch/a.tar.gz" | awk '{print $1}')"
          release_has_checksums v0.10.43
          release_has_checksums v0.11.0
          if release_has_checksums v0.10.42 || release_has_checksums v0.9.99 || release_has_checksums main; then exit 1; fi
          test "$(release_archive_name v0.10.43)" = "ninedeploy-v0.10.43.tar.gz"
          test "$(release_asset_url v0.10.43 SHA256SUMS)" = "https://github.com/NineDeploy/NineDeploy/releases/download/v0.10.43/SHA256SUMS"
          # Without cosign the verifier reports "absent" (2) — never success.
          if ! command -v cosign >/dev/null 2>&1; then
            rc=0; verify_checksums_signature "$scratch/SHA256SUMS" "$scratch/none.json" || rc=$?
            test "$rc" = 2
          fi
          # An EXECUTED run must ignore the source-only flag (only a sourced
          # one returns early) — it reaches argument parsing and rejects this.
          if NINEDEPLOY_INSTALL_SOURCE_ONLY=1 bash ./install.sh --not-an-installer-flag >/dev/null 2>&1; then
            echo "::error::install.sh honoured NINEDEPLOY_INSTALL_SOURCE_ONLY in an executed run"
            exit 1
          fi
          rm -rf "$scratch"
          echo "installer helper smoke test passed"

  docker-image:
    name: Docker image build and node smokes (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Six smoke groups, each on its own runner. One after another they took 43 minutes of a
    # runner on November 25, 2026, on every push and every pull request. A group's smokes own
    # their Docker fixtures, as the Release workflow's cohorts do, and each job builds the image.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [canary, autoscaling, autoscaling-rps, databases, lifecycle, routing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1

      - name: Verify Node security baseline
        run: node -e "if (process.versions.node !== '26.12.1') throw new Error('Unexpected Node runtime')"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verifies the release workflow's Dockerfile compiles; no push happens here.
      - name: Build the image
        run: docker build -t ninedeploy:ci .

      - name: Verify in-place upgrade from the latest published release
        if: matrix.group == 'lifecycle'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .temp_files/ci-candidate-upgrade
          previous="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker pull "ghcr.io/ninedeploy/ninedeploy:$previous"
          candidate="$(node --input-type=module -e "import {readFileSync} from 'node:fs';const text=readFileSync('apps/server/src/version.ts','utf8');const match=/export const VERSION = '([^']+)'/.exec(text);if(!match)process.exit(1);process.stdout.write('v'+match[1])")"
          docker image inspect "ghcr.io/ninedeploy/ninedeploy:$previous" --format '{{json .}}' | jq '{Id, RepoDigests}' > .temp_files/ci-candidate-upgrade/from-image.json
          docker image inspect ninedeploy:ci --format '{{json .}}' | jq '{Id, RepoDigests}' > .temp_files/ci-candidate-upgrade/to-image.json
          jq -n --arg source "$GITHUB_SHA" --arg from "$previous" --arg to "$candidate" --arg run "$GITHUB_RUN_ID" \
            '{sourceCommit: $source, fromVersion: $from, toVersion: $to, runId: $run}' > .temp_files/ci-candidate-upgrade/run.json
          node scripts/smoke-upgrade.mjs --from="$previous" --to="$candidate" --to-image=ninedeploy:ci 2>&1 | tee .temp_files/ci-candidate-upgrade/upgrade.log

      - name: Preserve candidate upgrade evidence
        if: always() && matrix.group == 'lifecycle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-candidate-upgrade-${{ github.run_id }}
          path: .temp_files/ci-candidate-upgrade/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify public node autoscaling with real routing
        if: matrix.group == 'autoscaling'
        timeout-minutes: 20
        run: node scripts/smoke-node-canary.mjs --image=ninedeploy:ci --autoscale-only --proof=.temp_files/ci-node-autoscale

      - name: Verify public canary lifecycle with sampled traffic
        if: matrix.group == 'canary'
        timeout-minutes: 20
        run: node scripts/smoke-node-canary.mjs --image=ninedeploy:ci --proof=.temp_files/ci-public-canary

      - name: Preserve public canary traffic evidence
        if: always() && matrix.group == 'canary'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-public-canary-${{ github.run_id }}
          path: |
            .temp_files/ci-public-canary/cases.json
            .temp_files/ci-public-canary/*-traffic.json
            .temp_files/ci-public-canary/failure-state.json
            .temp_files/ci-public-canary/runtime-cleanup.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify local Docker readiness and native health gates
        if: matrix.group == 'lifecycle'
        timeout-minutes: 5
        run: node scripts/smoke-local-docker-readiness.mjs --image=ninedeploy:ci

      - name: Verify primary-network readiness through real Traefik
        if: matrix.group == 'routing'
        timeout-minutes: 8
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: default
        run: node scripts/smoke-primary-network-readiness.mjs --image=ninedeploy:ci --proof=.temp_files/ci-primary-network-readiness

      - name: Preserve primary-network readiness evidence
        if: always() && matrix.group == 'routing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-primary-network-readiness-${{ github.run_id }}
          path: .temp_files/ci-primary-network-readiness/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify ordinary serving-traffic observations through sealed HTTP
        if: matrix.group == 'routing'
        timeout-minutes: 12
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: default
        run: node scripts/smoke-serving-traffic.mjs --image=ninedeploy:ci --proof=.temp_files/ci-serving-traffic

      - name: Preserve serving-traffic observation evidence
        if: always() && matrix.group == 'routing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-serving-traffic-${{ github.run_id }}
          path: .temp_files/ci-serving-traffic/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify the node wake catcher on the image
        if: matrix.group == 'routing'
        timeout-minutes: 5
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: default
        run: node scripts/smoke-wake-catcher.mjs --image=ninedeploy:ci --proof=.temp_files/ci-wake-catcher

      - name: Verify staged catcher handoff without 502 responses
        if: matrix.group == 'routing'
        timeout-minutes: 8
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: default
        run: node scripts/smoke-wake-recovery.mjs --image=ninedeploy:ci --proof=.temp_files/ci-wake-recovery

      - name: Preserve public catcher handoff evidence
        if: always() && matrix.group == 'routing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-wake-recovery-${{ github.run_id }}
          path: .temp_files/ci-wake-recovery/public/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify node readiness modes and failure controls
        if: matrix.group == 'lifecycle'
        timeout-minutes: 10
        run: node scripts/smoke-container-readiness.mjs --image=ninedeploy:ci

      - name: Verify normal panel deploys across healthcheck modes with continuous traffic
        if: matrix.group == 'lifecycle'
        timeout-minutes: 15
        run: node scripts/smoke-node-canary.mjs --image=ninedeploy:ci --health-modes-only --proof=.temp_files/ci-panel-health-modes

      - name: Preserve panel healthcheck traffic evidence
        if: always() && matrix.group == 'lifecycle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-panel-health-modes-${{ github.run_id }}
          path: .temp_files/ci-panel-health-modes/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Preserve node autoscale proof
        if: always() && matrix.group == 'autoscaling'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-node-autoscale-${{ github.run_id }}
          path: .temp_files/ci-node-autoscale/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify node autoscaling with PostgreSQL and real routing
        if: matrix.group == 'databases'
        timeout-minutes: 20
        run: node scripts/smoke-node-canary.mjs --image=ninedeploy:ci --autoscale-database-only --proof=.temp_files/ci-node-autoscale-database

      - name: Preserve database autoscale proof
        if: always() && matrix.group == 'databases'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-node-autoscale-database-${{ github.run_id }}
          path: .temp_files/ci-node-autoscale-database/
          include-hidden-files: true
          if-no-files-found: ignore

      # R2: node RPS with default panel settings; the agent opts in with NINEDEPLOY_AGENT_PROXY_TRAFFIC=on.
      - name: Verify node request-rate autoscaling with a source-loss control
        if: matrix.group == 'autoscaling-rps'
        timeout-minutes: 25
        run: node scripts/smoke-node-canary.mjs --image=ninedeploy:ci --autoscale-rps-only --proof=.temp_files/ci-node-autoscale-rps

      - name: Preserve node RPS autoscale proof
        if: always() && matrix.group == 'autoscaling-rps'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-node-autoscale-rps-${{ github.run_id }}
          path: .temp_files/ci-node-autoscale-rps/
          include-hidden-files: true
          if-no-files-found: ignore

  # Publishes the panel image to GHCR on every push to main so an
  # `install.sh --docker` from the main channel never lands on a stale
  # `:latest`. The release workflow (release-publish.yml) pushes `:vX.Y.Z`
  # on every release tag and re-points `:latest` only when that tag is the
  # highest release (r573), so `:latest` is the newest RELEASE — never a main
  # build (that is `:edge`, pushed here).
  #
  # One-time setup: the GHCR package must be set to "Public" visibility
  # at https://github.com/orgs/NineDeploy/packages/container/ninedeploy/settings
  # so an unauthenticated `docker pull` works for fresh installs. This
  # is a GitHub Packages UI setting; there is no API call that can do
  # it from CI.
  #
  # Two jobs, two runners. Until November 26, 2026 one job built both
  # architectures on an amd64 runner, the arm64 one under emulation: on
  # November 25 its build steps took 63 seconds for amd64 and 383 for arm64,
  # in a job of 7.3 minutes. Now each architecture is built on a runner of
  # its own kind and pushed by digest, which names no tag; merge-image
  # below puts the two under the tags. A failed build therefore leaves
  # `:edge` where it was, as before.
  publish-image:
    name: Build the image for GHCR (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # Only build + push from main. PRs run the build-only job above
    # to keep the workflow cheap and to avoid forking a public image
    # for every fork PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The image must never reach `:edge` (what --channel=main installs
    # pull) before the server suite, the other packages' suites, the
    # integration tests and the image smokes are green — an independent
    # job would happily publish a broken commit.
    needs: [verify, package-tests, integration, docker-image]
    # Both builds run whatever the other does; neither is cancelled when
    # the other fails.
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - slug: arm64
            platform: linux/arm64
            # GitHub's arm64 runner builds natively: cold, the whole image
            # took 63 seconds there on November 25, 2026.
            runner: ubuntu-24.04-arm
    # L-14: least privilege. `packages: write` is the only permission
    # this job needs; everything else stays at the workflow default
    # of `contents: read`.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v6.7.0
        with:
          # The runner leaves with the job, so no builder has to be removed:
          # that took 20 seconds at the end of the arm64 probe on November 25, 2026.
          cleanup: false

      # One architecture, pushed by digest: nothing here names a tag. The
      # cache-from layer accelerates the next push and keeps the build under
      # the job's timeout even on a clean runner.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          push-by-digest: true
          # Buildx's default, written out: each architecture is pushed as
          # an index of its image and its provenance manifest, and
          # merge-image's index keeps both, as the one-runner build's did.
          provenance: mode=min
          cache-from: type=registry,ref=ghcr.io/ninedeploy/ninedeploy:edge
          cache-to: type=inline

      - name: Write the digest down
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build-push-action reported no image digest ('${DIGEST}')"
            exit 1
          fi
          mkdir -p /tmp/image-digests
          touch "/tmp/image-digests/${DIGEST#sha256:}"

      - name: Keep the digest for merge-image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ github.run_id }}-${{ matrix.slug }}
          path: /tmp/image-digests/
          if-no-files-found: error
          retention-days: 1

  # The moment `:edge` moves. It needs both builds, and a job is skipped
  # when a job it needs was skipped, so on a pull request it never runs.
  merge-image:
    name: Publish Docker image to GHCR (edge, main-<sha>)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-image
    permissions:
      packages: write
    steps:
      - name: Take the two digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-${{ github.run_id }}-*
          path: /tmp/image-digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:edge` is what `install.sh --channel=main` pulls; the
      # sha-pinned tag is the immutable artifact a release manager
      # can re-tag to `:latest` (or roll back to) without rebuilding.
      - name: Put both architectures under the tags
        working-directory: /tmp/image-digests
        run: |
          set -euo pipefail
          repo=ghcr.io/ninedeploy/ninedeploy
          count="$(find . -type f | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected one digest per architecture and got $count"
            exit 1
          fi
          docker buildx imagetools create \
            -t "$repo:edge" -t "$repo:main-${{ github.sha }}" \
            $(printf '%s@sha256:%s ' "$repo" *)

      - name: Check that the published image has both architectures
        run: |
          set -euo pipefail
          image="ghcr.io/ninedeploy/ninedeploy:main-${{ github.sha }}"
          platforms="$(docker buildx imagetools inspect "$image" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}')"
          for platform in linux/amd64 linux/arm64; do
            grep -qx "$platform" <<<"$platforms" || { echo "::error::$image has no $platform manifest"; exit 1; }
          done
          echo "$image:"
          printf '%s\n' "$platforms"

  # The other packages' suites, on a runner of their own. Until November 26, 2026 they
  # ran in the verify job before the server suite: 4.8 minutes of it on November 25,
  # 2026, 3.8 of them the web suite's, and all on a push's critical path. They do not
  # fit beside the server suite on one runner. In parallel they starve each other
  # (intermittent 30s waitFor failures that grow with the test count); beside the
  # server suite's processes on November 26, 2026, a packages/db test that starts two
  # child runs of the migrations passed its own 5-second limit at 5053 ms, and with the
  # server processes at a lower CPU priority a server test with a 20 ms deadline was
  # starved past it. The packages still run one at a time, each with its own coverage
  # floors; `release:check` runs them and the server suite one after the other
  # (`pnpm test:workspace`).
  package-tests:
    name: Other packages' suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Verify Node security baseline
        run: node -e "if (process.versions.node !== '26.12.1') throw new Error('Unexpected Node runtime')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo builds what a suite needs first (schemas and sdk).
      - name: Test
        run: pnpm test:packages

  integration:
    name: Integration tests (real Docker + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # No `version:` input on purpose: action-setup derives the pnpm version
        # from "packageManager" in package.json. Pinning a second version here
        # makes every job fail with ERR_PNPM_BAD_PM_VERSION once they disagree.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Verify Node security baseline
        run: node -e "if (process.versions.node !== '26.12.1') throw new Error('Unexpected Node runtime')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Runs the testcontainers suite (real PostgreSQL container): exercises
      # the REAL backup/restore path end-to-end — arg-array docker exec,
      # docker cp, and the at-rest backup encryption round-trip.
      - name: Run integration tests
        run: pnpm --filter @ninedeploy/server exec vitest run --config vitest.integration.config.ts
        env:
          RUN_INTEGRATION: '1'
