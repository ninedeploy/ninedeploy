name: Release

# Builds and publishes a Docker image when a version tag is
# pushed. The branches filter was dropped: GitHub's
# tag-vs-branch filter logic on this repo refused to
# match a clean `v*` tag push (it ran the workflow_run
# with 0 jobs, twice), so we now only fire on tags.
# A workflow_dispatch trigger is kept so an operator
# can re-run the same job graph manually with
# `gh workflow run release-publish.yml -f tag=v0.4.0` from the
# local checkout or the Actions "Run workflow" dropdown
# (the `tag` input decides what is built, not the ref).
#
# Tag format: STRICT semver (`vX.Y.Z`). The v0.4.1 release
# dropped the old `-hotfixN` suffix because install.sh and
# selfUpdate.ts refuse anything that does not match
# `^v\d+\.\d+\.\d+$`. A `v0.4.0-foo` tag would build
# successfully and push an image that no install path can
# ever resolve, so the workflow rejects it at the first
# step rather than shipping a phantom release.
#
# r581: publication is gated on the end-to-end smokes. Installed servers
# discover a release through the GitHub Releases API (updateCheck.ts, and
# install.sh's latest_tag since r571) and docker installs follow `:latest`,
# so neither may point at an image nobody has upgraded onto. Three jobs:
#   1. publish-image — checks, then builds and pushes ONLY `:vX.Y.Z` and
#      verifies its multi-arch manifest. Nothing discovers that tag yet.
#      r700: then signs the pushed DIGEST (cosign keyless) and attaches its
#      build provenance.
#   2. smoke-published-image — the upgrade smoke (previous published release
#      → this tag, on one data volume) and the user-journey smoke, both on
#      the pushed image.
#   3. promote-release — only after both smokes pass: re-points `:latest`
#      at the already-pushed manifest (when this tag is the highest; no
#      rebuild) and creates the GitHub Release. r701: as a draft carrying
#      the source archive, install.sh, SHA256SUMS and its Sigstore bundle,
#      published only once all of them are attached.
# A failed smoke therefore leaves a pushed `:vX.Y.Z` and a git tag but no
# Release and no `:latest` move — see ARCHITECTURE.md §13.1 "Release drill".

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v0.4.0). Must already exist on the remote and match ^v\\d+\\.\\d+\\.\\d+$'
        required: true
        type: string

# The release tag the whole job operates on. A tag push carries it in
# github.ref_name; a manual run does NOT — there github.ref_name is the
# BRANCH the workflow was dispatched from, and every step below used to read
# that branch name: the semver gate failed (or, worse, a validation bypass
# would have published :latest built from a branch while labelling it with
# the input tag). Every step now reads this single resolved value.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# r573: one run per release tag at a time — a tag push and a manual re-run of
# the same tag must not push and re-point images concurrently. Different tags
# may run in parallel: which of them moves `:latest` is decided by semver
# (the "Decide whether this tag moves :latest" step), not by finishing order.
concurrency:
  group: release-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

# L-14: least privilege at the workflow level; `packages: write` is granted
# only to the job that actually pushes the image.
permissions:
  contents: read

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # r581: this job only pushes `:vX.Y.Z`; creating the GitHub Release
      # (contents: write) moved to promote-release, behind the smokes.
      contents: read
      packages: write
      # r700: keyless signing — the job's GitHub OIDC token is exchanged for
      # a short-lived Sigstore (Fulcio) certificate naming this workflow; no
      # key exists to leak. attestations: write stores the build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run is dispatched from a BRANCH; without this pin the
          # job would build that branch's HEAD instead of the requested tag.
          ref: ${{ env.RELEASE_TAG }}

      # Fail fast on a non-semver tag (e.g. v0.4.0-foo, v0.4.0+meta).
      # The trigger filter `v*` accepts any v-prefixed ref, but
      # install.sh + selfUpdate.ts only resolve `^v\d+\.\d+\.\d+$`
      # — pushing a different shape would produce a tag that no
      # install path can ever reach. Validate before the long
      # install / build / push pipeline runs.
      - name: Validate tag format (^v\d+\.\d+\.\d+$)
        run: |
          if [ ! -n "${RELEASE_TAG:-}" ] || ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ref '$RELEASE_TAG' is not a strict semver tag (expected vX.Y.Z, got '$RELEASE_TAG')"
            echo "Hint: install.sh and selfUpdate.ts only resolve ^v\\d+\\.\\d+\\.\\d+\$ — pushing a different shape would ship a tag no install path can reach."
            exit 1
          fi
          echo "Tag '$RELEASE_TAG' is a valid semver release."

      # r475 (P1): version provenance. Tags are created by hand (`git tag vX
      # <commit>`), and nothing else in the chain compares the tag's value to
      # what the checkout actually contains — a typo or a stale SHA would pass
      # every check (it IS a green commit) and publish a mislabeled image that
      # also clobbers :latest. Refuse before install/build/push when the tag,
      # package.json and version.ts disagree.
      - name: Verify release provenance (tag == package.json == version.ts)
        run: |
          v="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          ts="$(sed -n "s/^export const VERSION = '\([^']*\)';/\1/p" apps/server/src/version.ts)"
          echo "tag=$v package.json=$pkg version.ts=$ts"
          if [ "$v" != "$pkg" ] || [ "$v" != "$ts" ]; then
            echo "::error::Provenance mismatch: tag=$v package.json=$pkg version.ts=$ts — tag the commit whose bump you mean."
            exit 1
          fi

      - name: Setup pnpm
        # Derived from "packageManager" in package.json — see ci.yml.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the whole workspace BEFORE the checks: server tests resolve the
      # built web dashboard layout (apps/web/dist) and turbo has no dependency
      # edge forcing web#build ahead of server#test, so the serialized
      # release:check alone can schedule them in either order. CI's test job
      # builds first for exactly this reason.
      - name: Build workspace
        run: pnpm build

      # A tag is a release artifact — never push an image that does not pass
      # the same verification gates CI enforces on every commit.
      - name: Release checks (typecheck · lint · build · test)
        run: pnpm release:check

      - name: Database backup integration checks
        run: pnpm --filter @ninedeploy/server exec vitest run --config vitest.integration.config.ts
        env:
          RUN_INTEGRATION: '1'

      - name: Derive image tags
        if: success()
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Hardcoded lowercase — GHCR / OCI image names
          # must be lowercase, but `github.repository`
          # preserves the case the repo was created with
          # ("NineDeploy/NineDeploy"). Relying on it
          # produces a `ghcr.io/NineDeploy/NineDeploy:edge`
          # tag in the default branch case and buildx
          # rejects it.
          images: ghcr.io/ninedeploy/ninedeploy
          # Branch references are skipped by the trigger
          # itself (`on: push: tags: ['v*']`) so no branch
          # slug is ever produced. The previous attempt used
          # `branches: []` here to mute the meta-action's
          # default `:edge` tag, but GitHub's workflow YAML
          # parser rejects an inline empty sequence with
          # `A sequence was not expected` at parse time
          # and the whole job fails before metadata-action
          # ever runs. The trigger is the only thing that
          # has to suppress branch refs; no `branches:`
          # key is needed.
          tags: |
            # One slug only — the canonical `:v0.4.0`. r581:
            # `:latest` is NOT pushed here; promote-release
            # re-points it at this exact manifest once the
            # smokes pass. Major / major-minor roll-ups
            # (`v0`, `v0.4`, `0`, `0.4`) are deliberately
            # omitted: this project does not ship patch-level
            # backports, so a `:v0.4` tag would mislead
            # anyone pinning to "the latest 0.4.x" into
            # thinking a 0.4.1 release exists.
            # `type=raw` with the resolved RELEASE_TAG instead
            # of `type=semver`: metadata-action derives the
            # semver from the GIT REF, which on a manual run
            # is the dispatch branch, not the tag.
            type=raw,value=${{ env.RELEASE_TAG }}
          # metadata-action otherwise adds `:latest` on its own for a
          # semver-shaped tag push (flavor latest=auto).
          flavor: |
            latest=false

      - name: Set up Docker Buildx
        # Multi-arch (amd64 + arm64) matches what the
        # ci.yml `publish-image` job does on main. Without
        # this the release would silently ship a linux/amd64
        # image only — every ARM host (Raspberry Pi, AWS
        # Graviton, Apple-Silicon-as-Tinkerbell-target) would
        # hit the "no matching manifest" error on `docker pull`.
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v6.7.0

      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep historical images: version-pinned installs and rollback depend on them.
      - name: Build and push
        if: success()
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Multi-arch mirrors the ci.yml `publish-image` job:
          # every install path (amd64 VPS, arm64 Raspberry
          # Pi / AWS Graviton, Apple-Silicon-as-target) can
          # pull a single tag without having to pin a
          # platform-specific digest.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Docker integration gate: the tag this release is about must exist in
      # the registry with BOTH platform manifests present. Without this, a
      # half-pushed build (one platform failing after the other succeeded)
      # would leave a tag that installs fine on one arch and 404s on the
      # other, with no check between push and release.
      - name: Smoke-check the pushed multi-arch manifest
        if: success()
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if docker buildx imagetools inspect "ghcr.io/ninedeploy/ninedeploy:${RELEASE_TAG}" \
                | grep -Eq 'linux/amd64' \
              && docker buildx imagetools inspect "ghcr.io/ninedeploy/ninedeploy:${RELEASE_TAG}" \
                | grep -Eq 'linux/arm64'; then
              echo "Multi-arch manifest verified for ${RELEASE_TAG}."
              exit 0
            fi
            echo "Manifest not complete yet (attempt $i/5) — retrying in 10s…"
            sleep 10
          done
          echo "::error::ghcr.io/ninedeploy/ninedeploy:${RELEASE_TAG} is missing an amd64/arm64 manifest"
          exit 1

      # r700: sign and attest what was pushed — the multi-arch index DIGEST,
      # never a tag (a tag can be re-pointed after signing; a digest cannot).
      # Operators verify with `cosign verify` / `gh attestation verify`
      # (README, "Verifying a release"). The identity checked below is the
      # one install.sh trusts for the release checksums (r702).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image digest (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          repo=ghcr.io/ninedeploy/ninedeploy
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build-push-action reported no image digest ('${DIGEST}') — refusing to sign a tag instead"
            exit 1
          fi
          # The tag must still resolve to the digest being signed.
          tagged="$(docker buildx imagetools inspect "${repo}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::${repo}:${RELEASE_TAG} is ${tagged:-unknown}, but this build pushed ${DIGEST}"
            exit 1
          fi
          cosign sign --yes "${repo}@${DIGEST}"
          NINEDEPLOY_INSTALL_SOURCE_ONLY=1 . ./install.sh
          cosign verify "${repo}@${DIGEST}" \
            --certificate-identity-regexp "$RELEASE_SIGNER_IDENTITY_RE" \
            --certificate-oidc-issuer "$RELEASE_SIGNER_ISSUER" >/dev/null
          echo "Signed and verified ${repo}@${DIGEST}"

      - name: Attest build provenance (pushed to the registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ninedeploy/ninedeploy
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records need the artifact-metadata permission and add
          # nothing `gh attestation verify` uses.
          create-storage-record: false


  # r581: the end-to-end gate. Both smokes run against the image publish-image
  # just pushed (`:vX.Y.Z` — nothing discovers it yet) inside a privileged
  # docker:28-dind sidecar, so their Traefik/app containers never touch the
  # runner's own daemon state. A failure here stops the release: no `:latest`
  # move and no GitHub Release, so no installed server is offered it.
  smoke-published-image:
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # releases API read (previous release) + pulling the GHCR images.
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The smokes read the TO version's migration journal and version.ts.
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      # smoke-upgrade reads the migrated SQLite file with @libsql/client,
      # resolved from packages/db; nothing else is needed (no build).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The upgrade starts from what installed servers actually run: the
      # highest PUBLISHED GitHub Release below this tag. Not `git tag` — a tag
      # can exist without a release (a run that failed this very gate leaves
      # exactly that), and no server was ever offered such a tag. Strictly
      # below: a re-run of an older tag must not "upgrade" downwards.
      - name: Find the previous published release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          released="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          prev="$(printf '%s\n' "$released" \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | awk -F'[v.]' -v cur="$RELEASE_TAG" '
                BEGIN { split(cur, c, /[v.]/); key = sprintf("%010d%010d%010d", c[2], c[3], c[4]) }
                { k = sprintf("%010d%010d%010d", $2, $3, $4); if ((k "") < (key "")) print k " " $0 }' \
            | sort | tail -1 | awk '{print $2}')"
          if [ -z "$prev" ]; then
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No published release below $RELEASE_TAG — skipping the upgrade smoke (nothing can upgrade onto it yet)."
          else
            echo "from=$prev" >> "$GITHUB_OUTPUT"
            echo "Upgrade smoke will run $prev → $RELEASE_TAG."
          fi

      # The slow-deploy seed pulls python:3.12 inside DinD; the script only
      # waits for it to reach `building`, but the whole run is bounded here.
      - name: Upgrade smoke (previous release → this tag, same data volume)
        if: steps.previous.outputs.from != ''
        timeout-minutes: 30
        env:
          FROM_TAG: ${{ steps.previous.outputs.from }}
        run: node scripts/smoke-upgrade.mjs --from="$FROM_TAG" --to="$RELEASE_TAG"

      - name: User-journey smoke on the pushed image
        timeout-minutes: 20
        run: node scripts/smoke-user-journey.mjs --image="ghcr.io/ninedeploy/ninedeploy:${RELEASE_TAG}"

  # r581: publication. Runs only when both smokes passed (needs: is
  # all-success by default), and changes nothing that was built — `:latest`
  # is re-pointed at the manifest the smokes exercised.
  # r701: it also builds the release's integrity assets (source archive,
  # install.sh, SHA256SUMS + its Sigstore bundle) and attaches them to a DRAFT
  # release, which is published — made visible to `releases/latest`, to
  # install.sh and to every installed server's update check — only once all
  # of them are present. A release can therefore never be discovered without
  # its checksums. Order: assets → draft → :latest → publish (last).
  promote-release:
    needs: [publish-image, smoke-published-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `contents: write` is needed to create the GitHub Release and upload
      # its assets; the workflow's contents: read default is too narrow
      # (HTTP 403 "Resource not accessible by integration").
      contents: write
      # Re-pointing `:latest` is a registry write.
      packages: write
      # r701: keyless `cosign sign-blob` of SHA256SUMS (GitHub OIDC → Fulcio).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CHANGELOG.md is attached to the Release from the TAG's tree.
          ref: ${{ env.RELEASE_TAG }}

      # r573: `:latest` is what fresh `install.sh --docker` runs on older
      # installers and a manual `docker pull` resolve. Every run used to
      # re-point it, so a workflow_dispatch re-run of an OLDER tag (or a slow
      # older run finishing after a newer one) moved `:latest` backwards.
      # Only the highest vX.Y.Z tag on the remote moves it now. r581: decided
      # here, at promotion time, after the smokes — not before the build.
      - name: Decide whether this tag moves :latest
        id: latest
        run: |
          set -euo pipefail
          highest="$(git ls-remote --tags --refs origin \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | awk -F'[v.]' '{ printf "%010d%010d%010d %s\n", $2, $3, $4, $0 }' \
            | sort | tail -1 | awk '{print $2}')"
          if [ "$highest" = "$RELEASE_TAG" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG is the highest release tag — :latest will point at it."
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$RELEASE_TAG is not the highest release tag ($highest) — publishing :$RELEASE_TAG only, :latest stays where it is."
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # r701: the archive install.sh downloads instead of GitHub's
      # auto-generated tag tarball (which GitHub may regenerate, so it cannot
      # be checksummed once and for all). Built from the TAG object, not the
      # working tree; the release's install.sh asset is extracted FROM the
      # archive, so both are the same bytes. Then the release is proven to
      # verify with install.sh's OWN helpers (sourced, r576) — the identity
      # regexp, the bundle format and the SHA256SUMS parsing every installer
      # will use — before anything is published.
      - name: Build and sign the release assets (archive, install.sh, SHA256SUMS)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          out=release-assets
          rm -rf "$out" && mkdir "$out"
          archive="ninedeploy-${RELEASE_TAG}.tar.gz"
          top="ninedeploy-${RELEASE_TAG}"
          git archive --format=tar.gz --prefix="${top}/" -o "${out}/${archive}" "refs/tags/${RELEASE_TAG}"
          tar -xzf "${out}/${archive}" -O "${top}/install.sh" > "${out}/install.sh"
          # The content checks install.sh applies after the checksum.
          version="$(tar -xzf "${out}/${archive}" -O "${top}/package.json" | jq -r .version)"
          if [ "v${version}" != "$RELEASE_TAG" ]; then
            echo "::error::${archive} carries version '${version}', not ${RELEASE_TAG}"
            exit 1
          fi
          # (No `grep -q` on a tar listing: it exits at the first match, tar
          # dies of SIGPIPE, and pipefail turns a match into a failure.)
          tar -tzf "${out}/${archive}" | grep -x "${top}/pnpm-workspace.yaml" >/dev/null
          if [ "$(tar -tvzf "${out}/${archive}" | grep -c '^l' || true)" != "0" ]; then
            echo "::error::${archive} contains symlinks — install.sh would refuse it"
            exit 1
          fi
          (cd "$out" && sha256sum "$archive" install.sh > SHA256SUMS)
          cat "${out}/SHA256SUMS"
          cosign sign-blob --yes --bundle "${out}/SHA256SUMS.sigstore.json" "${out}/SHA256SUMS"

          NINEDEPLOY_INSTALL_SOURCE_ONLY=1 . ./install.sh
          test "$(release_archive_name "$RELEASE_TAG")" = "$archive"
          verify_checksums_signature "${out}/SHA256SUMS" "${out}/SHA256SUMS.sigstore.json"
          test "$(sha256sums_lookup "$archive" < "${out}/SHA256SUMS")" = "$(sha256sum "${out}/${archive}" | awk '{print $1}')"
          test "$(sha256sums_lookup install.sh < "${out}/SHA256SUMS")" = "$(sha256sum "${out}/install.sh" | awk '{print $1}')"
          echo "Release assets for ${RELEASE_TAG} built, signed and verified with install.sh's own checks."

      # r701: a DRAFT is invisible to releases/latest and to every installer
      # and update check. A re-run finds its own draft (replace the assets) or
      # an already-published release: one that has SHA256SUMS keeps its assets
      # untouched; one from before r701 gets them, SHA256SUMS uploaded LAST so
      # an installer never sees checksums whose archive is not there yet.
      - name: Attach the assets to a draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          a=release-assets
          state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)"
          case "$state" in
            none)
              notes="$(mktemp)"
              {
                printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for the full release notes.\n\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
                printf '**Pull the image:**\n```\ndocker pull ghcr.io/ninedeploy/ninedeploy:%s\ndocker pull ghcr.io/ninedeploy/ninedeploy:latest\n```\n\n' "$RELEASE_TAG"
                printf '**Verify it:** the image is signed with cosign (keyless) and carries build provenance; `SHA256SUMS` covers the source archive and `install.sh`, and `SHA256SUMS.sigstore.json` is its signature. See [Verifying a release](https://github.com/%s/blob/%s/README.md#verifying-a-release).\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
              } > "$notes"
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                --title "$RELEASE_TAG" --notes-file "$notes" \
                "$a/ninedeploy-${RELEASE_TAG}.tar.gz" "$a/install.sh" "$a/SHA256SUMS.sigstore.json" "$a/SHA256SUMS" CHANGELOG.md
              ;;
            draft)
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                "$a/ninedeploy-${RELEASE_TAG}.tar.gz" "$a/install.sh" "$a/SHA256SUMS.sigstore.json" "$a/SHA256SUMS" CHANGELOG.md
              ;;
            published)
              if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -x SHA256SUMS >/dev/null; then
                echo "::notice::$RELEASE_TAG is already published with its checksums — its assets are left as they are."
              else
                gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                  "$a/ninedeploy-${RELEASE_TAG}.tar.gz" "$a/install.sh" "$a/SHA256SUMS.sigstore.json" CHANGELOG.md
                gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$a/SHA256SUMS"
              fi
              ;;
          esac
          names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for want in "ninedeploy-${RELEASE_TAG}.tar.gz" install.sh SHA256SUMS SHA256SUMS.sigstore.json CHANGELOG.md; do
            if ! printf '%s\n' "$names" | grep -x "$want" >/dev/null; then
              echo "::error::The $RELEASE_TAG release is missing its $want asset — not publishing it"
              exit 1
            fi
          done
          echo "The $RELEASE_TAG release carries all of its assets."

      - name: Set up Docker Buildx
        if: steps.latest.outputs.move == 'true'
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v6.7.0

      - name: Log in to GHCR
        if: steps.latest.outputs.move == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry-side retag: `imagetools create` writes a new tag for the
      # EXISTING multi-arch index — no rebuild, so `:latest` is byte-for-byte
      # the image the smokes ran (and the digest publish-image signed, r700).
      # The digest comparison proves it.
      - name: Move :latest to the smoked manifest (retag, no rebuild)
        if: steps.latest.outputs.move == 'true'
        run: |
          set -euo pipefail
          repo=ghcr.io/ninedeploy/ninedeploy
          docker buildx imagetools create --tag "${repo}:latest" "${repo}:${RELEASE_TAG}"
          want="$(docker buildx imagetools inspect "${repo}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          got="$(docker buildx imagetools inspect "${repo}:latest" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::${repo}:latest is ${got:-unknown}, expected ${RELEASE_TAG}'s ${want:-unknown}"
            exit 1
          fi
          echo ":latest → ${RELEASE_TAG} (${want})"

      # Publish the GitHub Release. Without it the tag exists in git but the
      # Releases page stays empty and no installed server is offered the
      # version. r581: this is the step that makes the release discoverable,
      # so it is the last one. r701: it publishes the draft built above, so
      # the release appears WITH its checksums; it is marked "Latest" only
      # when this tag is the highest (the r573 decision) — a re-run of an
      # older tag must not move `releases/latest` backwards either.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOVE_LATEST: ${{ steps.latest.outputs.move }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$MOVE_LATEST"
            echo "Published $RELEASE_TAG (latest=$MOVE_LATEST)."
          else
            echo "::notice::$RELEASE_TAG was already published — left as it is."
          fi
