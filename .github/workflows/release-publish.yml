name: Release

# Builds and publishes a Docker image when a version tag is
# pushed. The branches filter was dropped: GitHub's
# tag-vs-branch filter logic on this repo refused to
# match a clean `v*` tag push (it ran the workflow_run
# with 0 jobs, twice), so we now only fire on tags.
# A workflow_dispatch trigger is kept so an operator
# can re-run the same job graph manually with
# `gh workflow run release.yml --ref v0.4.0` from the
# local checkout or the Actions "Run workflow" dropdown
# on a chosen ref.
#
# Tag format: STRICT semver (`vX.Y.Z`). The v0.4.1 release
# dropped the old `-hotfixN` suffix because install.sh and
# selfUpdate.ts refuse anything that does not match
# `^v\d+\.\d+\.\d+$`. A `v0.4.0-foo` tag would build
# successfully and push an image that no install path can
# ever resolve, so the workflow rejects it at the first
# step rather than shipping a phantom release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v0.4.0). Must already exist on the remote and match ^v\\d+\\.\\d+\\.\\d+$'
        required: true
        type: string

# The release tag the whole job operates on. A tag push carries it in
# github.ref_name; a manual run does NOT — there github.ref_name is the
# BRANCH the workflow was dispatched from, and every step below used to read
# that branch name: the semver gate failed (or, worse, a validation bypass
# would have published :latest built from a branch while labelling it with
# the input tag). Every step now reads this single resolved value.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# L-14: least privilege at the workflow level; `packages: write` is granted
# only to the job that actually pushes the image.
permissions:
  contents: read

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `contents: write` is needed for softprops/action-gh-release
      # to create the GitHub Release; the workflow's contents: read
      # default is too narrow and the action returns HTTP 403
      # "Resource not accessible by integration" otherwise.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run is dispatched from a BRANCH; without this pin the
          # job would build that branch's HEAD instead of the requested tag.
          ref: ${{ env.RELEASE_TAG }}

      # Fail fast on a non-semver tag (e.g. v0.4.0-foo, v0.4.0+meta).
      # The trigger filter `v*` accepts any v-prefixed ref, but
      # install.sh + selfUpdate.ts only resolve `^v\d+\.\d+\.\d+$`
      # — pushing a different shape would produce a tag that no
      # install path can ever reach. Validate before the long
      # install / build / push pipeline runs.
      - name: Validate tag format (^v\d+\.\d+\.\d+$)
        run: |
          if [ ! -n "${RELEASE_TAG:-}" ] || ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ref '$RELEASE_TAG' is not a strict semver tag (expected vX.Y.Z, got '$RELEASE_TAG')"
            echo "Hint: install.sh and selfUpdate.ts only resolve ^v\\d+\\.\\d+\\.\\d+\$ — pushing a different shape would ship a tag no install path can reach."
            exit 1
          fi
          echo "Tag '$RELEASE_TAG' is a valid semver release."

      - name: Setup pnpm
        # Derived from "packageManager" in package.json — see ci.yml.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the whole workspace BEFORE the checks: server tests resolve the
      # built web dashboard layout (apps/web/dist) and turbo has no dependency
      # edge forcing web#build ahead of server#test, so the serialized
      # release:check alone can schedule them in either order. CI's test job
      # builds first for exactly this reason.
      - name: Build workspace
        run: pnpm build

      # A tag is a release artifact — never push an image that does not pass
      # the same verification gates CI enforces on every commit.
      - name: Release checks (typecheck · lint · build · test)
        run: pnpm release:check

      - name: Database backup integration checks
        run: pnpm --filter @ninedeploy/server exec vitest run --config vitest.integration.config.ts
        env:
          RUN_INTEGRATION: '1'

      - name: Derive image tags
        if: success()
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Hardcoded lowercase — GHCR / OCI image names
          # must be lowercase, but `github.repository`
          # preserves the case the repo was created with
          # ("NineDeploy/NineDeploy"). Relying on it
          # produces a `ghcr.io/NineDeploy/NineDeploy:edge`
          # tag in the default branch case and buildx
          # rejects it.
          images: ghcr.io/ninedeploy/ninedeploy
          # Branch references are skipped by the trigger
          # itself (`on: push: tags: ['v*']`) so no branch
          # slug is ever produced. The previous attempt used
          # `branches: []` here to mute the meta-action's
          # default `:edge` tag, but GitHub's workflow YAML
          # parser rejects an inline empty sequence with
          # `A sequence was not expected` at parse time
          # and the whole job fails before metadata-action
          # ever runs. The trigger is the only thing that
          # has to suppress branch refs; no `branches:`
          # key is needed.
          tags: |
            # Two slugs only — the canonical `:v0.4.0` and
            # the unprefixed `:latest` that install.sh pulls
            # by default. Major / major-minor roll-ups
            # (`v0`, `v0.4`, `0`, `0.4`) are deliberately
            # omitted: this project does not ship patch-level
            # backports, so a `:v0.4` tag would mislead
            # anyone pinning to "the latest 0.4.x" into
            # thinking a 0.4.1 release exists. Only
            # `:v0.4.0` and `:latest` are produced.
            # `type=raw` with the resolved RELEASE_TAG instead
            # of `type=semver`: metadata-action derives the
            # semver from the GIT REF, which on a manual run
            # is the dispatch branch, not the tag.
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        # Multi-arch (amd64 + arm64) matches what the
        # ci.yml `publish-image` job does on main. Without
        # this the release would silently ship a linux/amd64
        # image only — every ARM host (Raspberry Pi, AWS
        # Graviton, Apple-Silicon-as-Tinkerbell-target) would
        # hit the "no matching manifest" error on `docker pull`.
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v6.7.0

      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep historical images: version-pinned installs and rollback depend on them.
      - name: Build and push
        if: success()
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Multi-arch mirrors the ci.yml `publish-image` job:
          # every install path (amd64 VPS, arm64 Raspberry
          # Pi / AWS Graviton, Apple-Silicon-as-target) can
          # pull a single tag without having to pin a
          # platform-specific digest.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Docker integration gate: the tag this release is about must exist in
      # the registry with BOTH platform manifests present. Without this, a
      # half-pushed build (one platform failing after the other succeeded)
      # would leave a tag that installs fine on one arch and 404s on the
      # other, with no check between push and release.
      - name: Smoke-check the pushed multi-arch manifest
        if: success()
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if docker buildx imagetools inspect "ghcr.io/ninedeploy/ninedeploy:${RELEASE_TAG}" \
                | grep -Eq 'linux/amd64' \
              && docker buildx imagetools inspect "ghcr.io/ninedeploy/ninedeploy:${RELEASE_TAG}" \
                | grep -Eq 'linux/arm64'; then
              echo "Multi-arch manifest verified for ${RELEASE_TAG}."
              exit 0
            fi
            echo "Manifest not complete yet (attempt $i/5) — retrying in 10s…"
            sleep 10
          done
          echo "::error::ghcr.io/ninedeploy/ninedeploy:${RELEASE_TAG} is missing an amd64/arm64 manifest"
          exit 1

      # Create the GitHub Release for this tag. Without this
      # step the tag exists in git but the Releases page stays
      # empty — every `git describe`, GitHub download URL, or
      # Releases-page visitor lands on a "No release notes"
      # dead-end. We pull the body from CHANGELOG.md (the
      # `## [0.4.0] - …` section) and pin the `v0.4.0` image
      # as the canonical download, so the page mirrors what
      # the project actually ships.
      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md) for the full release notes.

            **Pull the image:**
            ```
            docker pull ghcr.io/ninedeploy/ninedeploy:${{ env.RELEASE_TAG }}
            docker pull ghcr.io/ninedeploy/ninedeploy:latest
            ```
          files: |
            CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
