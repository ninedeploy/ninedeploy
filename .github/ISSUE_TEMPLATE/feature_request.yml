name: Feature request
description: Suggest something NineDeploy should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work in the panel, the CLI or the API.
  - type: textarea
    id: today
    attributes:
      label: How you handle it now
      description: A workaround, or another tool you use for it (Coolify, Dokploy, a script…).
