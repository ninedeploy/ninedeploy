# ── NineDeploy standalone container deployment ────────────────────────────
# Boots the production panel image with the host Docker socket mounted, so
# deployed apps, managed databases and the Traefik ingress container are all
# managed as host siblings through the socket. No systemd, no host Node.js.
#
# Easiest: let the installer manage this file and its .env for you —
#   ./install.sh --docker        (or: curl … install.sh | bash -s -- --docker)
#
# Manually:
#   echo "NINEDEPLOY_JWT_SECRET=$(openssl rand -hex 32)" >> .env
#   echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" >> .env
#   docker compose -f docker-compose.prod.yml up -d
#
# The panel answers on http://<host>:3000. Domains attached to services are
# served by the ninedeploy-traefik sibling container on :80/:443 — keep those
# ports free on the host. PM2-type services and UFW firewall management need
# the bare-metal installer instead (see docs/QUICKSTART.md).
#
# The image runs as the non-root `ninedeploy` user; the host socket is
# typically root:docker mode 0660, so the docker group's GID is required.
#
# Values are read from a .env file next to this compose file (docker compose
# loads it automatically). The installer (install.sh --docker) maintains that
# file for you; manually, create it with at least:
#
#   NINEDEPLOY_JWT_SECRET=<openssl rand -hex 32>
#   DOCKER_GID=$(getent group docker | cut -d: -f3)

name: ninedeploy

services:
  ninedeploy:
    image: ghcr.io/ninedeploy/ninedeploy:latest
    # Or build locally: docker compose -f docker-compose.prod.yml build --no-cache
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Host-side port is variable; the container always listens on 3000.
      # Bound to LOOPBACK by default: this port speaks plain HTTP, and login
      # plus bearer/refresh tokens cross it — anyone on the network could
      # read them. Terminate TLS (Traefik on :80/:443, or your own proxy) and
      # reach the panel through it; set NINEDEPLOY_BIND=0.0.0.0 only if you
      # explicitly accept plaintext exposure on the LAN.
      - "${NINEDEPLOY_BIND:-127.0.0.1}:${NINEDEPLOY_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # A strong secret is mandatory — production refuses to boot on the
      # known defaults (see apps/server/src/env.ts).
      NINEDEPLOY_JWT_SECRET: "${NINEDEPLOY_JWT_SECRET:?generate one: openssl rand -hex 32}"
      NINEDEPLOY_PUBLIC_URL: ${NINEDEPLOY_PUBLIC_URL:-http://localhost:3000}
      # Optional integrations (set in .env; empty values are treated as unset):
      NINEDEPLOY_ACME_EMAIL: ${NINEDEPLOY_ACME_EMAIL:-}
      NINEDEPLOY_DNS_PROVIDER: ${NINEDEPLOY_DNS_PROVIDER:-}
      NINEDEPLOY_DNS_TOKEN: ${NINEDEPLOY_DNS_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite db, git checkouts, encrypted backups and master.key live here.
      - ninedeploy-data:/data
    group_add:
      - "${DOCKER_GID:?set it: getent group docker | cut -d: -f3}"
volumes:
  ninedeploy-data:
